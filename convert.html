<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Base64 Converter Multi-Format</title>
<style>
  *{box-sizing:border-box}
  body{background:#111;color:#fff;padding:30px;font-family:system-ui;max-width:960px;margin:auto;line-height:1.6}
  h3{color:#f0c36b}
  textarea{width:100%;height:140px;background:#1a1a1a;color:#fff;border:1px solid #444;padding:12px;border-radius:8px;font-family:monospace;font-size:11px;resize:vertical}
  button{background:#f0c36b;color:#000;padding:12px 22px;border-radius:999px;border:none;font-weight:bold;cursor:pointer;margin:5px 4px;font-size:13px;transition:all .3s}
  button:hover{background:#ffdf9e;transform:translateY(-1px)}
  button.secondary{background:#333;color:#fff;border:1px solid #555}
  select{background:#222;color:#fff;border:1px solid #555;padding:10px;border-radius:8px;font-size:13px;margin:5px 4px}
  input[type=range]{vertical-align:middle}
  img{max-width:100%;border-radius:8px;margin:20px 0;box-shadow:0 8px 30px rgba(0,0,0,.5);display:block;background:repeating-conic-gradient(#222 0 25%,#1a1a1a 0 50%) 0 0/20px 20px}
  #status{margin-top:15px;padding:14px;border-radius:8px;font-size:13px}
  .ok{background:#1a3a2a;color:#7ce0cf}
  .err{background:#3a1a1a;color:#ff7a90}
  .info{background:#2a2a1a;color:#ffd27a}
  .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:15px}
  .meta div{background:#1a1a1a;padding:10px;border-radius:6px;font-size:12px}
  .meta b{color:#f0c36b;display:block;margin-bottom:3px}
  .badge{display:inline-block;background:#f0c36b;color:#000;font-weight:bold;padding:2px 10px;border-radius:999px;font-size:11px;margin-left:6px}
</style></head>
<body>

<h3>🔧 Base64 Converter <span class="badge">MULTI-FORMAT</span></h3>
<p style="opacity:.7">Mendukung: <b>JPG · PNG · GIF · WebP · BMP · SVG · ICO · TIFF</b> — format terdeteksi otomatis, dan bisa dikonversi ke format lain.</p>

<textarea id="input" placeholder="Tempel string base64 di sini (format apa pun)..."></textarea>
<br>

<label style="font-size:12px;opacity:.7">Format output:</label>
<select id="fmtSel">
  <option value="auto">🔍 Auto-detect (pertahankan asli)</option>
  <option value="jpg">JPG</option>
  <option value="png">PNG</option>
  <option value="webp">WebP</option>
  <option value="gif">GIF (tanpa konversi)</option>
  <option value="bmp">BMP (tanpa konversi)</option>
  <option value="svg">SVG (tanpa konversi)</option>
</select>
<label style="font-size:12px;opacity:.7">Kualitas (JPG/WebP):</label>
<input type="range" id="quality" min="0.3" max="1" step="0.05" value="0.92">
<span id="qval" style="font-size:12px">92%</span>
<br>

<button onclick="run()">🚀 Convert & Download</button>
<button class="secondary" onclick="check()">🔍 Cek Format</button>
<button class="secondary" onclick="pasteFromClip()">📋 Paste dari Clipboard</button>

<div id="status"></div>
<img id="img" style="display:none">
<div class="meta" id="meta" style="display:none"></div>

<script>
const $ = id => document.getElementById(id);
$('quality').oninput = e => $('qval').textContent = Math.round(e.target.value*100) + '%';

/* ====== DATABASE FORMAT (deteksi lewat magic bytes) ====== */
const FORMATS = [
  { sig:'/9j/',      mime:'image/jpeg',    ext:'jpg',  name:'JPEG' },
  { sig:'iVBOR',     mime:'image/png',     ext:'png',  name:'PNG'  },
  { sig:'R0lGOD',    mime:'image/gif',     ext:'gif',  name:'GIF'  },
  { sig:'UklGR',     mime:'image/webp',    ext:'webp', name:'WebP' },
  { sig:'Qk',        mime:'image/bmp',     ext:'bmp',  name:'BMP'  },
  { sig:'AAABAA',    mime:'image/x-icon',  ext:'ico',  name:'ICO'  },
  { sig:'SUkq',      mime:'image/tiff',    ext:'tiff', name:'TIFF' },
  { sig:'TU0A',      mime:'image/tiff',    ext:'tiff', name:'TIFF' },
  { sig:'PHN2Zw',    mime:'image/svg+xml', ext:'svg',  name:'SVG'  },
  { sig:'PD94bW',    mime:'image/svg+xml', ext:'svg',  name:'SVG'  },
  { sig:'PCFYTU',    mime:'image/svg+xml', ext:'svg',  name:'SVG'  },
];
const EXT2MIME = { jpg:'image/jpeg', png:'image/png', webp:'image/webp', gif:'image/gif', bmp:'image/bmp', svg:'image/svg+xml' };

function detectFormat(b64){
  for (const f of FORMATS) if (b64.startsWith(f.sig)) return f;
  try {
    const head = atob(b64.slice(0, 200));
    if (head.includes('<svg') || head.includes('<?xml')) return FORMATS.find(f=>f.ext==='svg');
  } catch(e){}
  return { mime:'image/jpeg', ext:'jpg', name:'JPEG (asumsi)' };
}

function cleanBase64(raw){
  let s = raw.trim();
  s = s.replace(/^data:[^;]+;base64,/gi, '');   // buang header apa pun
  s = s.replace(/^base64,/gi, '');
  s = s.replace(/[^A-Za-z0-9+/=]/g, '');         // buang spasi/newline
  while (s.length % 4 !== 0) s += '=';           // perbaiki padding
  return s;
}

function log(msg, type='info'){ $('status').className = type; $('status').innerHTML = msg; }

function showMeta(d){
  const m = $('meta');
  m.innerHTML = `
    <div><b>Format</b>${d.name}</div>
    <div><b>Dimensi</b>${d.w}×${d.h}px</div>
    <div><b>Ukuran</b>${(d.size/1024).toFixed(1)} KB</div>
    <div><b>Metode</b>${d.method}</div>
  `;
  m.style.display = 'grid';
}

async function pasteFromClip(){
  try { $('input').value = await navigator.clipboard.readText(); log('✓ Paste berhasil!','ok'); }
  catch(e){ log('✗ Clipboard diblokir browser — paste manual (Ctrl+V).','err'); }
}

function check(){
  const raw = $('input').value;
  if (!raw.trim()) return log('✗ Input kosong!','err');
  const cleaned = cleanBase64(raw);
  const f = detectFormat(cleaned);
  log(`🔎 Terdeteksi: <b>${f.name}</b> (${f.mime})<br>• Panjang: ${cleaned.length} karakter<br>• Perkiraan ukuran: ${(cleaned.length*0.75/1024).toFixed(1)} KB`,'ok');
}

/* ====== konversi antar format via canvas ====== */
function convertViaCanvas(blob, targetMime, quality){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      c.getContext('2d').drawImage(img, 0, 0);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('toBlob gagal')), targetMime, quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('gambar tidak bisa dibaca')); };
    img.src = URL.createObjectURL(blob);
  });
}

function b64ToBlob(b64, mime){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}

/* ====== METODE UTAMA ====== */
async function run(){
  const raw = $('input').value;
  if (!raw.trim()) return log('✗ Input kosong!','err');

  const cleaned = cleanBase64(raw);
  if (cleaned.length < 100) return log('✗ Base64 terlalu pendek — kemungkinan terpotong saat copy.','err');

  const detected = detectFormat(cleaned);
  const choice = $('fmtSel').value;
  const target = choice === 'auto' ? detected : { mime: EXT2MIME[choice] || detected.mime, ext: choice, name: choice.toUpperCase() };
  const quality = parseFloat($('quality').value);

  log(`⏳ Format terdeteksi: <b>${detected.name}</b> → output: <b>${target.name}</b>...`,'info');

  let blob = null, method = '';

  // Metode 1: langsung ke blob
  try { blob = b64ToBlob(cleaned, detected.mime); method = 'atob langsung'; }
  catch(e){
    // Metode 2: fetch
    try { const r = await fetch('data:'+detected.mime+';base64,'+cleaned); blob = await r.blob(); method = 'fetch'; }
    catch(e2){ return log('❌ Base64 rusak / tidak valid.','err'); }
  }

  // kalau user minta format berbeda & bisa dikonversi canvas
  const convertible = ['image/jpeg','image/png','image/webp'];
  if (target.mime !== detected.mime && convertible.includes(target.mime) && detected.mime !== 'image/svg+xml'){
    try {
      blob = await convertViaCanvas(blob, target.mime, quality);
      method += ' → konversi canvas';
    } catch(e){ log('⚠️ Konversi format gagal, pakai format asli.','info'); target.mime = detected.mime; target.ext = detected.ext; }
  }

  // preview
  const url = URL.createObjectURL(blob);
  const img = $('img');
  img.onload = () => {
    showMeta({ name: target.name, w: img.naturalWidth, h: img.naturalHeight, size: blob.size, method });
    triggerDownload(blob, target.ext);
    log(`✅ Berhasil! <b>${target.name}</b> ${img.naturalWidth}×${img.naturalHeight}px, ${(blob.size/1024).toFixed(1)} KB — download dimulai.`,'ok');
  };
  img.onerror = () => log('❌ File tidak bisa ditampilkan sebagai gambar.','err');
  img.src = url;
}

function triggerDownload(blob, ext){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'foto_kenangan_' + Date.now() + '.' + ext;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

$('input').addEventListener('paste', () => setTimeout(check, 150));
</script>
</body>
</html>
